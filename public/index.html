<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon Light — Learning Management System</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2226%22 font-size=%2224%22>🎓</text></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'Georgia', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-full flex flex-col text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top Navigation Bar Container -->
  <div id="navbar-root"></div>

  <!-- Dynamic Application Root View -->
  <main id="app-root" class="flex-1 w-full"></main>

  <!-- Global Footer -->
  <footer id="footer-root" class="bg-white border-t border-gray-100 py-10 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
        
        <div class="space-y-1">
          <div class="flex items-center justify-center md:justify-start gap-2">
            <span class="text-xl">🎓</span>
            <span class="font-extrabold text-base tracking-tight text-gray-900">
              Moon <span class="text-indigo-600">Light</span>
            </span>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-50 text-indigo-700">Member 4</span>
          </div>
          <p class="text-xs text-gray-500 max-w-sm">
            Empowering the next generation of engineers, designers, and tech leaders through interactive course mastery.
          </p>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-6 text-xs font-semibold text-gray-600">
          <a href="#dashboard" class="hover:text-indigo-600 transition-colors">Dashboard</a>
          <a href="#catalogue" class="hover:text-indigo-600 transition-colors">Course Catalogue</a>
          <a href="#my-courses" class="hover:text-indigo-600 transition-colors">My Courses</a>
          <a href="#profile" class="hover:text-indigo-600 transition-colors">Student Profile</a>
          <a href="#admin" class="hover:text-purple-600 transition-colors">Admin Management</a>
        </div>

        <div class="text-xs text-gray-400">
          <p>© 2026 LMS Learning Management System.</p>
          <p class="text-[11px] mt-0.5 text-gray-400">All student progress persisted in localStorage.</p>
        </div>

      </div>
    </div>
  </footer>

  <!-- Application Entry Script (ES Modules) -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
